[build]
# Tell Railway to build using the Dockerfile in the project root
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects $PORT automatically; uvicorn reads it via the CMD in the Dockerfile
startCommand = "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environments.production.variables]
# Set GOOGLE_API_KEY in the Render dashboard under Environment, not here.
# Listing it here as a reminder — Render will inject it securely at runtime.
# GOOGLE_API_KEY = ""
PYTHONUNBUFFERED = "1"
